name: Website checks

on:
  push:
    branches:
      - main
      - staging
      - "staging/**"
      - "web-requests/**"
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

# Netlify's GitHub integration owns deployments. The former CLI deploy job
# targeted a different site and failed independently of the live integration.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test preview protection
        run: node --test scripts/*preview*.test.mjs
      - name: Build site
        run: npm run build
